<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuestLine | Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css"><link id="favicon" rel="icon" type="image/svg+xml">
</head>
<body data-music-page="profile" data-music-default="big-waves">
  <div class="page-shell">
    <header class="site-header"><a class="brand" href="index.html"><span>Quest</span><span class="brand-line">Line</span></a><nav class="main-nav" aria-label="Main navigation"><a href="index.html">Games</a><a href="rewards.html">Rewards</a></nav><a class="profile-button active" href="profile.html" aria-label="Open your profile"><span class="profile-avatar" aria-hidden="true">?</span><span class="profile-name">Profile</span></a></header>
    <main>
      <section class="profile-page" aria-labelledby="profile-title">
        <p class="eyebrow">Your QuestLine account</p><h1 id="profile-title">Profile</h1>
        <p class="profile-loading" id="profile-loading" role="status" aria-live="polite">Checking your session...</p>
        <div id="profile-auth" hidden><form id="profile-auth-form" novalidate>
          <label for="profile-email">Email</label><input id="profile-email" name="email" type="email" autocomplete="email" required>
          <label for="profile-password">Password</label><input id="profile-password" name="password" type="password" autocomplete="current-password" required>
          <button class="auth-submit" id="profile-sign-in" type="submit">Sign in</button>
          <p class="auth-message" id="profile-message" role="alert" aria-live="assertive"></p>
          <a class="auth-submit" href="index.html?auth=required&amp;mode=signup">Create an account</a>
        </form></div>
        <div id="profile-account" hidden>
          <p class="account-label">Signed in as</p><p class="account-email" id="profile-account-email"></p>
          <div class="account-music-setting"><label for="default-song-select">Default song</label><select id="default-song-select" disabled><option value="">Use each page's built-in song</option></select><small>Used whenever a page does not have its own song selection.</small></div>
          <button class="auth-submit" id="reset-songs-button" type="button">Reset all songs to default</button><button class="auth-submit sign-out-button" id="sign-out-button" type="button">Sign out</button>
          <p class="auth-message" id="account-message" role="status" aria-live="polite"></p>
        </div>
      </section>
      <section class="music-player" aria-label="Background music" hidden><audio id="background-music" src="assets/Big_Waves.wav" loop preload="auto"></audio><div class="music-player-info"><span class="eyebrow">Now playing</span><span class="music-title">Big Waves</span></div><button class="music-toggle" id="music-toggle" type="button" aria-label="Play background music" aria-pressed="false"><span aria-hidden="true">Play</span></button><label class="volume-control" for="music-volume"><span aria-hidden="true">Volume</span><input id="music-volume" type="range" min="0" max="1" step="0.01" value="0.35"><output id="music-volume-value" for="music-volume">35%</output></label></section>
    </main>
    <footer class="site-footer"><span>QuestLine © 2026</span><span>More games are on the way.</span></footer>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="song-rewards.js"></script><script src="site-ui.js"></script><script src="profile.js"></script>
</body></html>
